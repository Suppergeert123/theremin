; PlatformIO Project Configuration File

; ---------------------------------------------------------------------------
; Arduino Uno (ATmega328P), plain C with avr-libc
; ---------------------------------------------------------------------------
[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
upload_protocol = arduino
build_flags =
    -std=gnu11
    -Wall
    -Wextra

; Unity-tests worden uitgevoerd in de native omgeving, niet op de Uno.
test_ignore = *

; ---------------------------------------------------------------------------
; Native unit tests on the PC
; Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Isrc

build_src_filter =
    +<frequency.c>
    +<volume_calc.c>
    +<filter.c>
    

test_build_src = yes

